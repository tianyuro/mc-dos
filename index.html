<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>大肥鲸制作器</title>
    <style>
        :root { --bg-color: #121318; --card-bg: #1c1e26; --text-main: #e2e2e2; --text-sub: #888a99; --accent: #e04f3f; --border-color: #2d303e; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; }
        
        .top-bar { padding: 15px 20px; font-size: 18px; font-weight: bold; border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
        .page-container { flex: 1; padding: 15px; overflow-y: auto; display: none; }
        .page-container.active { display: block; }
        
        .card { background-color: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 15px; border: 1px solid var(--border-color); }
        .card-title { font-size: 16px; font-weight: bold; margin-bottom: 15px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 8px; }
        .form-control { width: 100%; padding: 12px; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: white; font-size: 14px; outline: none; }
        
        .btn { width: 100%; padding: 14px; border-radius: 8px; border: none; font-size: 15px; font-weight: bold; color: white; background-color: var(--accent); cursor: pointer; margin-top: 10px; }
        
        /* 底部导航栏：强制固定在底部并加高，防止被手机系统底栏遮挡 */
        .bottom-nav { height: 65px; background-color: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { color: var(--text-sub); font-size: 13px; cursor: pointer; padding: 10px; }
        .nav-item.active { color: var(--accent); font-weight: bold; }
        
        .progress-bar { width: 100%; height: 6px; background-color: #2d303e; border-radius: 3px; margin-top: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background-color: var(--accent); width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>

    <div class="top-bar">🐋 大肥鲸制作器</div>

    <div id="page-download" class="page-container active">
        <div class="card">
            <div class="card-title">配置下载项</div>
            <div class="input-group">
                <label>选择游戏版本</label>
                <select id="versionSelect" class="form-control">
                    <option value="">数据加载中，请稍候...</option>
                </select>
            </div>
        </div>
        <div class="card">
            <div class="card-title">下载进度</div>
            <div style="font-size: 13px; color: var(--text-sub); margin-bottom: 10px;" id="statusText">准备就绪</div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <button class="btn" onclick="startDownload()">开始下载</button>
        </div>
    </div>

    <div id="page-library" class="page-container">
        <div class="card"><div class="card-title">前置库</div><p>暂未开放</p></div>
    </div>
    
    <div id="page-mods" class="page-container">
        <div class="card"><div class="card-title">Mod库</div><p>暂未开放</p></div>
    </div>

    <div id="page-manage" class="page-container">
        <div class="card"><div class="card-title">整合包打包</div><p>暂未开放</p></div>
    </div>

    <!-- 底部导航 -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchPage('download', this)">游戏</div>
        <div class="nav-item" onclick="switchPage('library', this)">前置</div>
        <div class="nav-item" onclick="switchPage('mods', this)">Mod</div>
        <div class="nav-item" onclick="switchPage('manage', this)">整合包</div>
    </div>

    <script>
        // 页面切换
        function switchPage(pageId, element) {
            document.querySelectorAll('.page-container').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            element.classList.add('active');
        }

        // 获取版本数据
        async function loadVersions() {
            const selectEl = document.getElementById('versionSelect');
            try {
                // 使用国内极速镜像
                const res = await fetch('https://bmclapi2.bangbang93.com/mc/game/version_manifest.json');
                const data = await res.json();
                
                selectEl.innerHTML = ''; // 清空提示
                
                const groups = { "✨ 正式版": [], "🚀 快照版": [], "🏛️ 远古版": [] };
                
                data.versions.forEach(v => {
                    if (v.type === 'release') groups["✨ 正式版"].push(v.id);
                    else if (v.type === 'snapshot') groups["🚀 快照版"].push(v.id);
                    else groups["🏛️ 远古版"].push(v.id);
                });

                // 插入分类
                for (const [groupName, versions] of Object.entries(groups)) {
                    if (versions.length > 0) {
                        const optgroup = document.createElement('optgroup');
                        optgroup.label = groupName;
                        versions.forEach(v => {
                            const opt = document.createElement('option');
                            opt.value = v; opt.text = v;
                            optgroup.appendChild(opt);
                        });
                        selectEl.appendChild(optgroup);
                    }
                }
            } catch (e) {
                selectEl.innerHTML = '<option value="">网络超时，获取失败</option>';
            }
        }

        window.onload = loadVersions;

        // 模拟下载
        function startDownload() {
            const version = document.getElementById('versionSelect').value;
            if(!version) return alert("请先选择版本！");
            const statusText = document.getElementById('statusText');
            const progressFill = document.getElementById('progressFill');
            let p = 0;
            statusText.innerText = `正在下载 ${version}...`;
            const int = setInterval(() => {
                p += 15;
                if(p >= 100) { p = 100; clearInterval(int); statusText.innerText = "下载完成"; }
                progressFill.style.width = p + "%";
            }, 200);
        }
    </script>
</body>
</html>
