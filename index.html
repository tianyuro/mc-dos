<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大肥鲸的专属永久网盘</title>
    <style>
        :root {
            --bg: #0d1117; --card: #161b22; --text: #c9d1d9;
            --accent: #58a6ff; --btn: #238636; --border: #30363d; --danger: #da3633;
        }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        h1 { margin: 0; color: var(--accent); font-size: 24px; }
        
        .admin-panel { display: none; background: var(--card); border: 1px dashed var(--accent); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .admin-panel input[type="text"], .admin-panel input[type="password"] { width: 100%; padding: 10px; margin-bottom: 10px; background: #0d1117; border: 1px solid var(--border); color: white; border-radius: 6px; box-sizing: border-box; }
        .admin-panel input[type="file"] { display: none; }
        .upload-btn { display: inline-block; background: var(--btn); color: white; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; text-align: center; }
        
        .file-list { display: grid; gap: 15px; }
        .file-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .file-info h3 { margin: 0 0 5px 0; font-size: 16px; word-break: break-all; }
        .file-info p { margin: 0; font-size: 12px; color: #8b949e; }
        .download-btn { background: var(--accent); color: #0d1117; padding: 8px 15px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 14px; }
        .btn { background: #21262d; color: var(--text); border: 1px solid var(--border); padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .progress { margin-top: 10px; font-size: 14px; color: #e3b341; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>☁️ 大肥鲸永久网盘</h1>
            <button class="btn" id="loginBtn" onclick="login()">🔑 作者登录</button>
        </header>

        <div class="admin-panel" id="adminPanel">
            <h3>👑 欢迎回来，作者</h3>
            
            <label>你的仓库名 (例如: tianyuro/mc-dos)</label>
            <input type="text" id="repoInput" placeholder="用户名/仓库名">

            <label>你的 GitHub Token (ghp_...)</label>
            <input type="password" id="tokenInput" placeholder="粘贴你的 Token，浏览器会记住它">
            
            <div style="margin-top: 15px; margin-bottom: 15px;">
                <label for="fileInput" class="upload-btn" id="uploadLabel">📤 选择文件并上传至 GitHub</label>
                <input type="file" id="fileInput" onchange="uploadToGitHub()">
            </div>
            
            <div class="progress" id="progressText"></div>
            <button class="btn" style="background: var(--danger); border: none; margin-top: 15px;" onclick="logout()">退出登录</button>
        </div>

        <div class="file-list" id="fileList">
            <!-- 文件列表会渲染在这里 -->
        </div>
    </div>

    <script>
        // =========================================================
        // 👇👇👇 咱们的专属密码字典 👇👇👇
        // 暗号是：大肥鲸
        const SECRET_DICTIONARY = {
            "0x99, 0x88": "大肥鲸" 
        };
        // 👆👆👆 如果你以后想换暗号，改这里的 "大肥鲸" 就行 👆👆👆
        // =========================================================

        let isLogin = false;

        window.onload = function() {
            document.getElementById('repoInput').value = localStorage.getItem('gh_repo') || '';
            document.getElementById('tokenInput').value = localStorage.getItem('gh_token') || '';
            loadFilesFromGitHub();
        }

        function login() {
            const pwd = prompt("请输入专属暗号：");
            if (pwd !== null) {
                const cleanPwd = pwd.trim(); // 去除空格
                
                // 遍历字典，比对暗号
                let isValid = false;
                for (let key in SECRET_DICTIONARY) {
                    if (SECRET_DICTIONARY[key] === cleanPwd) {
                        isValid = true;
                        break;
                    }
                }

                if (isValid) {
                    isLogin = true;
                    document.getElementById('adminPanel').style.display = 'block';
                    document.getElementById('loginBtn').innerText = "👑 已登录";
                    document.getElementById('loginBtn').style.background = "#238636";
                    document.getElementById('loginBtn').style.border = "none";
                } else {
                    alert("暗号错误！请确认你输入的是：大肥鲸");
                }
            }
        }

        function logout() {
            isLogin = false;
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('loginBtn').innerText = "🔑 作者登录";
            document.getElementById('loginBtn').style.background = "#21262d";
            document.getElementById('loginBtn').style.border = "1px solid #30363d";
        }

        // 核心：上传文件到 GitHub
        function uploadToGitHub() {
            const file = document.getElementById('fileInput').files[0];
            const repo = document.getElementById('repoInput').value.trim();
            const token = document.getElementById('tokenInput').value.trim();

            if (!file || !repo || !token) { alert("请填好仓库名、Token并选择文件！"); return; }

            localStorage.setItem('gh_repo', repo);
            localStorage.setItem('gh_token', token);

            const progress = document.getElementById('progressText');
            progress.innerText = "⏳ 正在读取文件并上传，文件过大时请耐心等待...";
            document.getElementById('uploadLabel').style.opacity = "0.5";

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Content = e.target.result.split(',')[1]; 
                const timestamp = new Date().getTime();
                const fileExt = file.name.includes('.') ? '.' + file.name.split('.').pop() : '';
                const fileNameOnly = file.name.replace(fileExt, '');
                const safeFileName = `${fileNameOnly}_${timestamp}${fileExt}`;

                const url = `https://api.github.com/repos/${repo}/contents/${safeFileName}`;
                
                fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Upload ${safeFileName} via Web Netdisk`,
                        content: base64Content
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.content && data.content.download_url) {
                        progress.innerText = "✅ 上传成功！文件已永久保存在你的仓库。";
                        document.getElementById('uploadLabel').style.opacity = "1";
                        loadFilesFromGitHub();
                    } else {
                        progress.innerText = "❌ 上传失败：" + (data.message || "未知错误");
                        document.getElementById('uploadLabel').style.opacity = "1";
                    }
                })
                .catch(err => { 
                    progress.innerText = "❌ 请求失败: " + err; 
                    document.getElementById('uploadLabel').style.opacity = "1";
                });
            };
            reader.readAsDataURL(file);
        }

        // 核心：读取仓库里的文件列表
        function loadFilesFromGitHub() {
            const repo = document.getElementById('repoInput').value.trim();
            if (!repo) return; 

            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '<div style="color:#8b949e; font-size:14px;">正在加载文件列表...</div>';

            const url = `https://api.github.com/repos/${repo}/contents/`;
            const token = document.getElementById('tokenInput').value.trim();
            const headers = token ? { 'Authorization': `token ${token}` } : {};

            fetch(url, { headers })
            .then(res => res.json())
            .then(files => {
                if (Array.isArray(files)) {
                    fileList.innerHTML = ''; 
                    const validFiles = files.filter(file => file.type === 'file' && file.name !== 'index.html');
                    
                    if (validFiles.length === 0) {
                        fileList.innerHTML = '<div style="color:#8b949e; font-size:14px;">暂无文件，请作者上传。</div>';
                        return;
                    }

                    validFiles.forEach(file => {
                        const directUrl = `https://cdn.jsdelivr.net/gh/${repo}@main/${file.name}`;
                        const card = document.createElement('div');
                        card.className = 'file-card';
                        card.innerHTML = `
                            <div class="file-info">
                                <h3>📄 ${file.name}</h3>
                                <p>大小: ${(file.size / 1024).toFixed(2)} KB</p>
                            </div>
                            <a href="${directUrl}" class="download-btn" target="_blank">下载</a>
                        `;
                        fileList.appendChild(card);
                    });
                } else {
                    fileList.innerHTML = '<div style="color:#da3633; font-size:14px;">获取列表失败，请检查仓库名是否正确。</div>';
                }
            })
            .catch(err => {
                fileList.innerHTML = '<div style="color:#da3633; font-size:14px;">网络请求错误，请检查网络连接。</div>';
            });
        }
    </script>
</body>
</html>
